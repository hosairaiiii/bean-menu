name: Translate intros

# Optional: bilingual intros through an OpenAI-compatible API (key in the repo secret TR_API_KEY,
# e.g. a DeepSeek key). Without the secret this does nothing; the page then translates in the browser.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    paths: ["scraper/translate.py", ".github/workflows/translate.yml"]

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          TR_API_KEY: ${{ secrets.TR_API_KEY }}
          TR_API_URL: ${{ vars.TR_API_URL }}
          TR_MODEL: ${{ vars.TR_MODEL }}
        run: python scraper/translate.py 400
      - name: Commit translations
        run: |
          git config user.name "bean-menu-bot"
          git config user.email "bean-menu-bot@users.noreply.github.com"
          git add docs/data/tr.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "intros: $(date -u +'%Y-%m-%d %H:%M') UTC" && (git push || (git pull --rebase -X theirs && git push)); fi
